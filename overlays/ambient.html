<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Batcave ambient</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 1.2s linear; }
  canvas.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script>
/*
 * Batcave ambient scene (fan-made, original art, comic-ink style).
 * Mounted on the "behind" layer: paints under the dashboard, click-through.
 * Scene: cave, stalactites, drips, waterfall, Batcomputer screens, Batman
 * typing in his chair, Alfred bringing coffee from the elevator, parked
 * Batmobile, suit cases, giant penny, and a bat swarm now and then.
 * Dark mode only. Reduced motion = one still frame. Pauses when hidden.
 * Preview alone: open overlays/ambient.html#preview (add ,t=20 to jump
 * 20 seconds in, e.g. #preview,t=20).
 */
(() => {
  'use strict'
  const cv = document.getElementById('c')
  const ctx = cv.getContext('2d')
  const BAT = new Path2D('M12 8.5L11 6.5L10.4 9C8 8 4.5 8 1 10.5C3.5 10.8 4.6 12 4.8 14C6.2 12.8 8 12.8 9.2 14C10.3 14.6 11.2 16 12 17.5C12.8 16 13.7 14.6 14.8 14C16 12.8 17.8 12.8 19.2 14C19.4 12 20.5 10.8 23 10.5C19.5 8 16 8 13.6 9L13 6.5Z')
  const BLUE = '79,195,247', GOLD = '242,194,48', RED = '255,90,90'
  const INK = '#000'
  const R = (a, b) => a + Math.random() * (b - a)
  const rgba = (c, a) => `rgba(${c},${a})`
  const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
  const smooth = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u) }
  const lerp = (a, b, u) => a + (b - a) * u

  let W = 0, H = 0, S = 1, cx = 0, fy = 0, t = 0
  let stat = null, tips = [], blocks = [], dust = [], drips = [], blips = []

  // Scene units: 1 unit = 1px at 1600x900. Origin = chair center on floor.
  const DOOR = -740, SERVE = -235, DESK = -118, CAR = -950, PENNY = -1190
  const SCREENS = {
    main: [-160, -370, 320, 180], left: [-410, -340, 230, 140], right: [180, -340, 230, 140],
    t1: [-250, -480, 150, 85], t2: [-75, -492, 150, 85], t3: [100, -480, 150, 85]
  }

  // Comic ink: flat fill, black outline, thin cool rim light.
  function ink(fill, draw, w = 2.6, rim = 0.3) {
    ctx.beginPath(); draw(); ctx.closePath()
    ctx.fillStyle = fill; ctx.fill()
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'
    ctx.lineWidth = w; ctx.strokeStyle = INK; ctx.stroke()
    if (rim > 0) { ctx.lineWidth = 1; ctx.strokeStyle = rgba(BLUE, rim); ctx.stroke() }
  }
  // Inked thick limb: black outline under a colored core.
  function limb(color, w, pts) {
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'
    for (const [col, lw] of [[INK, w + 4], [color, w]]) {
      ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath()
      ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1])
      ctx.stroke()
    }
  }

  function layout() {
    W = cv.width = Math.max(1, innerWidth)
    H = cv.height = Math.max(1, innerHeight)
    S = Math.max(0.45, Math.min(W / 1600, H / 900))
    cx = W * 0.68; fy = H * 0.93
    blocks = []; for (let i = 0; i < 55; i++) blocks.push([Math.random(), Math.random(), R(0.03, 0.09), R(0.03, 0.08)])
    blips = []; for (let i = 0; i < 7; i++) blips.push([R(0, Math.PI * 2), R(0.2, 0.9)])
    dust = []; for (let i = 0; i < 40; i++) dust.push({ x: R(-500, 500), y: R(-500, -40), v: R(3, 9), p: R(0, 7) })
    buildStatic()
  }

  // ---------- static layer ----------
  function buildStatic() {
    stat = document.createElement('canvas'); stat.width = W; stat.height = H
    const g = stat.getContext('2d')
    const gr = g.createLinearGradient(0, 0, 0, H)
    gr.addColorStop(0, '#04060a'); gr.addColorStop(0.55, '#0c1119'); gr.addColorStop(1, '#070a0f')
    g.fillStyle = gr; g.fillRect(0, 0, W, H)
    // Rock strata: wide soft bands, a few cracks.
    for (let i = 0; i < 26; i++) {
      g.fillStyle = `rgba(${R(110, 150) | 0},${R(130, 170) | 0},${R(160, 200) | 0},${R(0.015, 0.04)})`
      const y = R(H * 0.08, H * 0.9), h = R(14, 60) * S
      g.beginPath(); g.moveTo(0, y)
      for (let x = 0; x <= W; x += 80 * S) g.lineTo(x, y + Math.sin(x * 0.004 + i) * 18 * S)
      for (let x = W; x >= 0; x -= 80 * S) g.lineTo(x, y + h + Math.sin(x * 0.005 + i * 2) * 14 * S)
      g.closePath(); g.fill()
    }
    g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 1.5 * S
    for (let i = 0; i < 14; i++) {
      let x = R(0, W), y = R(H * 0.1, H * 0.5)
      g.beginPath(); g.moveTo(x, y)
      for (let k = 0; k < 6; k++) { x += R(-25, 25) * S; y += R(20, 60) * S; g.lineTo(x, y) }
      g.stroke()
    }
    // Halftone dots on the back wall (comic print feel).
    g.fillStyle = rgba(BLUE, 0.045); g.beginPath()
    const sp = 7 * S, rr = 0.9 * S
    for (let y = H * 0.1; y < fy; y += sp) for (let x = (y / sp % 2) * sp / 2; x < W; x += sp) { g.moveTo(x + rr, y); g.arc(x, y, rr, 0, 7) }
    g.fill()

    // Far tunnel: a cool opening deep in the back wall, with mist.
    {
      const tx = cx - 860 * S, ty = fy - 440 * S
      const tg = g.createRadialGradient(tx, ty, 10 * S, tx, ty, 260 * S)
      tg.addColorStop(0, 'rgba(120,190,230,.16)'); tg.addColorStop(0.45, 'rgba(90,150,190,.06)'); tg.addColorStop(1, 'rgba(60,110,150,0)')
      g.fillStyle = tg; g.fillRect(tx - 300 * S, ty - 300 * S, 600 * S, 640 * S)
      g.fillStyle = '#0b1a26'; g.beginPath(); g.ellipse(tx, ty + 40 * S, 120 * S, 190 * S, 0, 0, 7); g.fill()
      g.strokeStyle = INK; g.lineWidth = 2.5 * S; g.stroke()
      const ig = g.createLinearGradient(0, ty - 150 * S, 0, ty + 230 * S)
      ig.addColorStop(0, 'rgba(140,200,235,.10)'); ig.addColorStop(1, 'rgba(140,200,235,0)')
      g.fillStyle = ig; g.beginPath(); g.ellipse(tx, ty + 40 * S, 112 * S, 182 * S, 0, 0, 7); g.fill()
      g.strokeStyle = 'rgba(0,0,0,.7)'; g.lineWidth = 3 * S
      for (let k = 0; k < 5; k++) { g.beginPath(); g.ellipse(tx, ty + 40 * S, (135 + k * 26) * S, (205 + k * 22) * S, 0, Math.PI * (1.05 + k * 0.03), Math.PI * (1.95 - k * 0.03)); g.stroke() }
    }
    tips = []
    const row = (base, maxL, col, rec) => {
      g.fillStyle = col; g.beginPath(); g.moveTo(0, 0)
      let x = 0
      while (x < W) {
        const w = R(16, 60) * S, l = R(0.15, 1) * maxL * S
        g.lineTo(x, base); g.lineTo(x + w / 2, base + l)
        if (rec && l > maxL * S * 0.5) tips.push([x + w / 2, base + l])
        g.lineTo(x + w, base); x += w
      }
      g.lineTo(W, 0); g.closePath(); g.fill()
      g.strokeStyle = INK; g.lineWidth = 2 * S; g.stroke()
    }
    row(H * 0.06, 110, '#0e1219', false)
    // Floor.
    g.fillStyle = '#080a0e'; g.fillRect(0, fy, W, H - fy)
    g.fillStyle = INK; g.fillRect(0, fy - 2 * S, W, 2.5 * S)
    g.fillStyle = rgba(BLUE, 0.2); g.fillRect(0, fy, W, Math.max(1, 1.5 * S))
    for (let i = 1; i < 6; i++) { g.fillStyle = rgba(BLUE, 0.03); g.fillRect(0, fy + i * 9 * S, W, 1) }

    // Floor stalagmites along the back edge (behind the props).
    g.fillStyle = '#090c11'; g.strokeStyle = INK; g.lineWidth = 2 * S
    for (const [x0, n] of [[-20 * S, 3], [W - 300 * S, 4]]) {
      let x = x0
      for (let i = 0; i < n; i++) {
        const w = R(30, 70) * S, h = R(50, 140) * S
        g.beginPath(); g.moveTo(x, fy + 2); g.quadraticCurveTo(x + w * 0.35, fy - h * 0.6, x + w / 2, fy - h); g.quadraticCurveTo(x + w * 0.65, fy - h * 0.6, x + w, fy + 2); g.closePath(); g.fill(); g.stroke()
        x += w * 0.8
      }
    }

    g.save(); g.translate(cx, fy); g.scale(S, S)
    const ux = px => (px - cx) / S
    const gi = (fill, draw, w = 2.6, rim = 0.25) => {
      g.beginPath(); draw(); g.closePath(); g.fillStyle = fill; g.fill()
      g.lineJoin = 'round'; g.lineWidth = w; g.strokeStyle = INK; g.stroke()
      if (rim > 0) { g.lineWidth = 1; g.strokeStyle = rgba(BLUE, rim); g.stroke() }
    }

    // Giant penny.
    g.save(); g.translate(PENNY, 0); g.scale(0.8, 0.8)
    gi('#2a1d10', () => g.ellipse(0, -70, 18, 70, 0, 0, 7))
    gi('#3a2a17', () => g.ellipse(8, -70, 60, 70, 0, 0, 7))
    g.strokeStyle = 'rgba(210,150,80,.22)'; g.lineWidth = 3; g.beginPath(); g.ellipse(8, -70, 50, 60, 0, 0, 7); g.stroke()
    g.fillStyle = 'rgba(210,150,80,.12)'; g.beginPath(); g.ellipse(14, -74, 16, 24, 0, 0, 7); g.fill()
    g.restore()

    // Batmobile on turntable.
    g.save(); g.translate(CAR, 0); g.scale(0.62, 0.62)
    gi('#0f1319', () => g.ellipse(0, -4, 235, 18, 0, 0, 7))
    gi('#161c26', () => {
      g.moveTo(-175, -22); g.lineTo(-185, -52); g.lineTo(-150, -70); g.lineTo(-60, -88); g.lineTo(10, -108)
      g.lineTo(70, -96); g.lineTo(140, -64); g.lineTo(190, -48); g.lineTo(196, -22)
    }, 3, 0.35)
    for (const wx of [-120, 125]) gi('#06070a', () => g.arc(wx, -30, 38, 0, 7), 2.6, 0.2)
    g.fillStyle = '#2a2f38'; for (const wx of [-120, 125]) { g.beginPath(); g.arc(wx, -30, 14, 0, 7); g.fill() }
    g.fillStyle = rgba(RED, 0.5); g.fillRect(-186, -50, 6, 10)
    gi('rgba(79,195,247,.14)', () => { g.moveTo(-40, -86); g.lineTo(10, -102); g.lineTo(50, -94); g.lineTo(10, -82) }, 1.5, 0)
    // Tail fins.
    gi('#161c26', () => { g.moveTo(140, -64); g.lineTo(165, -112); g.lineTo(178, -60) }, 2.4, 0.3)
    g.restore()

    // Suit cases.
    for (const [x, robin] of [[-620, false], [-540, true]]) {
      gi('rgba(79,195,247,.05)', () => g.rect(x - 38, -250, 76, 240), 2, 0.3)
      gi('#11151c', () => g.rect(x - 44, -12, 88, 12), 2, 0); gi('#11151c', () => g.rect(x - 44, -258, 88, 8), 2, 0)
      const suit = robin ? '#5a1418' : '#1f2a3b'
      gi(suit, () => { g.moveTo(x - 26, -184); g.lineTo(x + 26, -184); g.lineTo(x + 20, -110); g.lineTo(x + 14, -24); g.lineTo(x - 14, -24); g.lineTo(x - 20, -110) }, 2.2, 0.15)
      gi(robin ? '#1c4a2a' : '#0a0c11', () => g.ellipse(x, -200, 11, 13, 0, 0, 7), 2.2, 0.15)
      if (!robin) gi('#0a0c11', () => { g.moveTo(x - 9, -206); g.lineTo(x - 8, -224); g.lineTo(x - 2, -210); g.lineTo(x + 2, -210); g.lineTo(x + 8, -224); g.lineTo(x + 9, -206) }, 2, 0)
      g.fillStyle = robin ? '#e8c43a' : rgba(GOLD, 0.6)
      g.beginPath(); g.ellipse(x, -160, robin ? 6 : 12, robin ? 6 : 6, 0, 0, 7); g.fill()
      if (!robin) { g.fillStyle = '#0a0c11'; g.save(); g.translate(x - 8, -168); g.scale(0.66, 0.66); g.fill(BAT); g.restore() }
      g.fillStyle = robin ? '#e8c43a' : '#c9a227'; g.fillRect(x - 20, -112, 40, 6)
    }

    // Elevator frame.
    gi('#12161e', () => g.rect(DOOR - 62, -294, 124, 294), 3, 0.2)
    g.fillStyle = '#050608'; g.fillRect(DOOR - 50, -280, 100, 280)
    g.fillStyle = rgba(GOLD, 0.35); g.fillRect(DOOR - 6, -290, 12, 4)

    // Computer frame, struts, desk.
    gi('#0d1118', () => g.roundRect(-440, -515, 880, 340, 18), 3.5, 0.2)
    g.fillStyle = '#0a0d13'; for (const sx of [-300, 0, 300]) gi('#0a0d13', () => g.rect(sx - 10, -180, 20, 70), 2.4, 0)
    gi('#121820', () => { g.moveTo(-480, DESK); g.lineTo(480, DESK); g.lineTo(450, DESK - 16); g.lineTo(-450, DESK - 16) }, 2.6, 0.3)
    gi('#0b0e14', () => g.rect(-480, DESK, 960, 22), 2.6, 0)
    gi('#07090d', () => g.rect(-460, DESK + 22, 20, 96 - 22), 2.4, 0); gi('#07090d', () => g.rect(440, DESK + 22, 20, 96 - 22), 2.4, 0)
    // Keyboard on the desk.
    g.fillStyle = '#161b24'; g.fillRect(-60, DESK - 20, 120, 6)
    g.fillStyle = rgba(BLUE, 0.4); for (let k = -54; k < 56; k += 8) g.fillRect(k, DESK - 18, 5, 2)
    g.restore()

    row(0, 160, '#05070a', true)
    // Vignette.
    const vg = g.createRadialGradient(W * 0.55, H * 0.5, H * 0.35, W * 0.55, H * 0.5, W * 0.75)
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)')
    g.fillStyle = vg; g.fillRect(0, 0, W, H)
  }

  // ---------- screens ----------
  function box(r, fn) {
    const [x, y, w, h] = r
    ctx.save()
    ctx.fillStyle = 'rgba(5,20,31,.94)'; ctx.fillRect(x, y, w, h)
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip()
    fn(x, y, w, h)
    ctx.fillStyle = rgba(BLUE, 0.05); ctx.fillRect(x, y + ((t * 28) % h), w, 3)
    ctx.restore()
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.strokeRect(x, y, w, h)
    ctx.lineWidth = 1.5; ctx.strokeStyle = rgba(BLUE, 0.5); ctx.strokeRect(x, y, w, h)
  }
  function mapScreen(x, y, w, h) {
    ctx.strokeStyle = rgba(BLUE, 0.1); ctx.lineWidth = 1
    for (let gx = x; gx < x + w; gx += 20) { ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); ctx.stroke() }
    for (let gy = y; gy < y + h; gy += 20) { ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); ctx.stroke() }
    ctx.strokeStyle = rgba(BLUE, 0.2)
    for (const b of blocks) ctx.strokeRect(x + b[0] * w, y + b[1] * h, b[2] * w, b[3] * h)
    ctx.strokeStyle = rgba(BLUE, 0.28); ctx.lineWidth = 5
    ctx.beginPath(); ctx.moveTo(x, y + h * 0.7); ctx.bezierCurveTo(x + w * 0.3, y + h * 0.4, x + w * 0.6, y + h, x + w, y + h * 0.55); ctx.stroke()
    const tx = x + w * (0.5 + 0.32 * Math.sin(t * 0.13)), ty = y + h * (0.5 + 0.3 * Math.sin(t * 0.21 + 1))
    ctx.strokeStyle = rgba(GOLD, 0.25); ctx.lineWidth = 1
    ctx.beginPath(); ctx.moveTo(tx, y); ctx.lineTo(tx, y + h); ctx.moveTo(x, ty); ctx.lineTo(x + w, ty); ctx.stroke()
    const pr = (t * 1.2) % 1
    ctx.strokeStyle = rgba(GOLD, 0.6 * (1 - pr)); ctx.lineWidth = 2
    ctx.beginPath(); ctx.arc(tx, ty, 4 + pr * 22, 0, 7); ctx.stroke()
    ctx.fillStyle = rgba(GOLD, 0.8); ctx.beginPath(); ctx.arc(tx, ty, 3, 0, 7); ctx.fill()
    ctx.font = 'bold 10px monospace'; ctx.fillStyle = rgba(GOLD, 0.6)
    ctx.fillText('GOTHAM CITY // SECTOR 7', x + 8, y + 15)
    if (Math.floor(t * 1.5) % 6 < 3) { ctx.fillStyle = rgba(RED, 0.6); ctx.fillText('TRACKING', x + w - 70, y + h - 9) }
  }
  function dataScreen(x, y, w, h) {
    const rowH = 10, off = (t * 16) % rowH, base = Math.floor(t * 16 / rowH)
    ctx.font = '8px monospace'
    for (let i = -1; i < h / rowH + 1; i++) {
      const n = base + i, yy = y + 6 + i * rowH - off
      ctx.fillStyle = hash(n * 3.1) > 0.88 ? rgba(GOLD, 0.45) : rgba(BLUE, 0.3)
      ctx.fillText(((hash(n) * 0xffff) | 0).toString(16).padStart(4, '0'), x + 6, yy + 7)
      ctx.fillRect(x + 38, yy + 2, hash(n * 1.7) * (w - 100), 4)
      ctx.fillRect(x + w - 50, yy + 2, hash(n * 2.3) * 40, 4)
    }
  }
  function radarScreen(x, y, w, h) {
    const rx = x + w / 2, ry = y + h / 2, r = Math.min(w, h) * 0.42
    ctx.strokeStyle = rgba(BLUE, 0.2); ctx.lineWidth = 1
    for (let k = 1; k <= 3; k++) { ctx.beginPath(); ctx.arc(rx, ry, r * k / 3, 0, 7); ctx.stroke() }
    ctx.beginPath(); ctx.moveTo(rx - r, ry); ctx.lineTo(rx + r, ry); ctx.moveTo(rx, ry - r); ctx.lineTo(rx, ry + r); ctx.stroke()
    const a = (t * 1.4) % (Math.PI * 2)
    for (let k = 0; k < 14; k++) {
      ctx.fillStyle = rgba(BLUE, 0.12 * (1 - k / 14))
      ctx.beginPath(); ctx.moveTo(rx, ry); ctx.arc(rx, ry, r, a - (k + 1) * 0.06, a - k * 0.06); ctx.closePath(); ctx.fill()
    }
    for (const [ba, bd] of blips) {
      let d = (a - ba) % (Math.PI * 2); if (d < 0) d += Math.PI * 2
      ctx.fillStyle = rgba(GOLD, 0.7 * Math.max(0, 1 - d / 3))
      ctx.beginPath(); ctx.arc(rx + Math.cos(ba) * r * bd, ry + Math.sin(ba) * r * bd, 2.5, 0, 7); ctx.fill()
    }
  }
  function waveScreen(x, y, w, h) {
    ctx.strokeStyle = rgba(BLUE, 0.5); ctx.lineWidth = 1.5; ctx.beginPath()
    for (let i = 0; i <= w; i += 3) {
      const v = Math.sin(i * 0.08 + t * 3) * 0.5 + Math.sin(i * 0.21 - t * 5) * 0.3 + Math.sin(i * 0.5 + t * 9) * 0.15
      ctx.lineTo(x + i, y + h / 2 + v * h * 0.32)
    }
    ctx.stroke()
    ctx.font = '8px monospace'; ctx.fillStyle = rgba(BLUE, 0.4); ctx.fillText('AUDIO // GCPD BAND', x + 6, y + 12)
  }
  function barScreen(x, y, w, h) {
    const n = 11, bw = (w - 16) / n
    for (let i = 0; i < n; i++) {
      const v = 0.25 + 0.7 * Math.abs(Math.sin(t * (0.6 + i * 0.13) + i))
      ctx.fillStyle = i === 7 ? rgba(GOLD, 0.45) : rgba(BLUE, 0.35)
      ctx.fillRect(x + 8 + i * bw, y + h - 8 - v * (h - 24), bw - 3, v * (h - 24))
    }
  }
  function logoScreen(x, y, w, h) {
    const sc = Math.min(w, h) / 24 * 0.95
    ctx.save(); ctx.translate(x + w / 2 - 12 * sc, y + h / 2 - 12 * sc); ctx.scale(sc, sc)
    ctx.fillStyle = rgba(GOLD, 0.28 + 0.14 * Math.sin(t * 1.3)); ctx.fill(BAT)
    ctx.restore()
    if (Math.floor(t * 0.5) % 5 === 0) { ctx.font = 'bold 9px monospace'; ctx.fillStyle = rgba(BLUE, 0.6); ctx.fillText('SYSTEM SECURE', x + 8, y + h - 8) }
  }
  function screens() {
    box(SCREENS.main, mapScreen); box(SCREENS.left, dataScreen); box(SCREENS.right, radarScreen)
    box(SCREENS.t1, waveScreen); box(SCREENS.t2, logoScreen); box(SCREENS.t3, barScreen)
  }
  function glow() {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'
    const fl = 0.9 + 0.1 * Math.sin(t * 7) * Math.sin(t * 2.3)
    const g = ctx.createRadialGradient(0, -300, 10, 0, -300, 650)
    g.addColorStop(0, rgba(BLUE, 0.11 * fl)); g.addColorStop(1, rgba(BLUE, 0))
    ctx.fillStyle = g; ctx.fillRect(-700, -900, 1400, 920)
    const f = ctx.createRadialGradient(0, 0, 10, 0, 0, 560)
    f.addColorStop(0, rgba(BLUE, 0.07 * fl)); f.addColorStop(1, rgba(BLUE, 0))
    ctx.fillStyle = f; ctx.save(); ctx.scale(1, 0.12); ctx.beginPath(); ctx.arc(0, 0, 560, 0, 7); ctx.fill(); ctx.restore()
    ctx.restore()
  }

  // ---------- Alfred ----------
  const A = { st: 'wait', until: 6, x: DOOR, ph: 0, dir: 1, face: 1, tray: true, put: 0 }
  let doorOpen = 0, mug = null, look = 0
  function steam(x, y, a) {
    ctx.strokeStyle = `rgba(220,230,240,${a})`; ctx.lineWidth = 1.4; ctx.lineCap = 'round'
    for (let k = 0; k < 3; k++) {
      ctx.beginPath()
      for (let i = 0; i <= 28; i += 2) ctx.lineTo(x - 4 + k * 4 + Math.sin(i * 0.25 - t * 3 + k * 2) * 2.5, y - i)
      ctx.stroke()
    }
  }
  function drawMug(x, y, hot) {
    ink('#d8dde3', () => ctx.roundRect(x - 7, y - 16, 14, 16, 2), 2, 0)

  function loop(ts) {
    if (!running) return
    const dt = Math.min(0.1, (ts - last) / 1000); last = ts; acc += dt
    if (acc >= 1 / 30 - 0.002) { frame(acc); acc = 0 }
    raf = requestAnimationFrame(loop)
  }
  function update() {
    const want = mode === 'dark' && !document.hidden
    if (!want) {
      running = false; cancelAnimationFrame(raf)
      if (!document.hidden) { cv.classList.remove('on'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H) }
      return
    }
    cv.classList.add('on')
    if (reduced()) {
      running = false; cancelAnimationFrame(raf)
      if (!mug) mug = { x: SERVE + 64, born: -1e9 }
      frame(0); return
    }
    if (!running) { running = true; last = performance.now(); raf = requestAnimationFrame(loop) }
  }
  window.addEventListener('message', e => {
    if (e.source !== window.parent) return
    const d = e.data
    if (!d || typeof d !== 'object' || d.type !== 'theme:state') return
    mode = d.mode === 'light' ? 'light' : d.mode === 'dark' ? 'dark' : mode
    hostReduced = d.reducedMotion === true
    update()
  })
  document.addEventListener('visibilitychange', update)
  if (osR && osR.addEventListener) osR.addEventListener('change', update)
  window.addEventListener('resize', () => { layout(); if (reduced()) update() })
  layout()
  if (preview) {
    // Stand-alone preview: solid page, no fade-in, and jump ahead so the
    // scene shows mid-action.
    document.body.style.background = '#0a0c0f'
    cv.style.transition = 'none'
    const m = /t=(\d+)/.exec(location.hash); const jump = m ? +m[1] : 0
    for (let i = 0; i < jump * 30; i++) frame(1 / 30)
  }
  update()
})()
</script>
